packages:
  - packages/*
  - apps/*

# One version of what several packages use. The Node types are those of the oldest Node the
# packages run on, so that nothing newer is used by mistake.
catalog:
  '@types/node': ^24.19.2
  zod: ^4.6.7
  esbuild: 0.28.2

# esbuild and workerd work without their install scripts: the binary of each is a package of
# its own, for the platform it is installed on.
allowBuilds:
  esbuild: false
  workerd: false
