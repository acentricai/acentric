packages:
  - packages/*
  - apps/*

# One version of what several packages use. The Node types are those of the oldest Node the
# packages run on, so that nothing newer is used by mistake.
catalog:
  '@types/node': ^24.19.2
  zod: ^4.6.7
  esbuild: 0.28.2

# esbuild works without its install script: its binary is a package of its own.
allowBuilds:
  esbuild: false
