[package]
name = "acentric-machine"
description = "The machine's side of Acentric: it connects out to an engine, runs the commands it is sent, and says how each ended."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# It is released as a binary, not as a crate.
publish = false

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
libc = "0.2.191"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
webpki-root-certs = "1.0.12"
