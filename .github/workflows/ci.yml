name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the packages run on, and the one the image ships.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      # The pnpm version is the root package.json's `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The server's tests run the machine daemon itself, which they build: the toolchain is
      # rust-toolchain.toml's.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm boundaries
      - run: pnpm test

  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag acentric-server .
      # The image has what the server needs and nothing it was built with: it has to start.
      - name: The server starts in its image, and says it is up
        run: |
          docker run --detach --name server --publish 127.0.0.1:4000:4000 acentric-server
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/health; then exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The daemon runs on both.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The toolchain is rust-toolchain.toml's.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
