name: Bug report
description: Something does not work as the docs say it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A failing test, a small agent, or the commands that show the problem.
      render: ts
  - type: input
    id: packages
    attributes:
      label: Packages and versions
      placeholder: '@acentric/runner-local 0.1.0, @acentric/cli 0.1.0'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.13, macOS 15
    validations:
      required: true
