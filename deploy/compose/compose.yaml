# The Acentric server on one machine, behind Caddy, which gets and renews its HTTPS
# certificate. How to use it is in README.md beside this file.
#
#   cp .env.example .env    # then fill it in
#   install -d -m 700 secrets
#   openssl rand -hex 32 > secrets/secret-key && openssl rand -hex 24 > secrets/admin-key
#   docker compose up -d

name: acentric

services:
  server:
    image: ghcr.io/acentricai/acentric-server:${ACENTRIC_VERSION:?set ACENTRIC_VERSION in .env}
    restart: unless-stopped
    environment:
      ACENTRIC_PUBLIC_URL: ${ACENTRIC_PUBLIC_URL:?set ACENTRIC_PUBLIC_URL in .env}
      # The keys, from files, not the environment, which `docker inspect` shows.
      ACENTRIC_SECRET_KEY_FILE: /run/secrets/secret-key
      ACENTRIC_ADMIN_KEY_FILE: /run/secrets/admin-key
      # Its own backups, every day and before an upgrade, in a volume of theirs, and copied to
      # a bucket off this machine when ACENTRIC_BACKUP_URL is given: see README.md.
      ACENTRIC_BACKUP_DIR: /backups
      ACENTRIC_BACKUP_EVERY: ${ACENTRIC_BACKUP_EVERY:-24h}
      ACENTRIC_BACKUP_KEEP: ${ACENTRIC_BACKUP_KEEP:-3}
      ACENTRIC_BACKUP_URL: ${ACENTRIC_BACKUP_URL:-}
      # What the bucket is reached with. Empty, the server looks where AWS's tools do: on an EC2
      # instance, its role.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      # Its log (text or json), and its metrics on a port of their own, which Caddy does not
      # pass on: for a Prometheus on this network (see README.md).
      ACENTRIC_LOG_FORMAT: ${ACENTRIC_LOG_FORMAT:-text}
      ACENTRIC_METRICS_PORT: ${ACENTRIC_METRICS_PORT:-}
      # How long archived actors, the audit log and usage are kept: for ever, without them.
      ACENTRIC_RETAIN_ARCHIVED: ${ACENTRIC_RETAIN_ARCHIVED:-}
      ACENTRIC_RETAIN_AUDIT: ${ACENTRIC_RETAIN_AUDIT:-}
      ACENTRIC_RETAIN_USAGE: ${ACENTRIC_RETAIN_USAGE:-}
    secrets: [secret-key, admin-key]
    volumes:
      # Everything the server keeps: its database, and conversations' images and files beside
      # it. One volume, on this machine's disk: never a network file system.
      - data:/data
      - backups:/backups
    # A turn that is going on is written down before the server stops.
    stop_grace_period: 60s
    # Only Caddy reaches it: it is on no port of this machine.
    expose: ['4000']

  caddy:
    image: caddy:2.11.8
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      ACENTRIC_PUBLIC_URL: ${ACENTRIC_PUBLIC_URL}
      ACENTRIC_HTTP_PORT: ${ACENTRIC_HTTP_PORT:-80}
      ACENTRIC_HTTPS_PORT: ${ACENTRIC_HTTPS_PORT:-443}
    # The same port inside as out, so that the address Caddy serves is the one people use.
    ports:
      - ${ACENTRIC_HTTP_PORT:-80}:${ACENTRIC_HTTP_PORT:-80}
      - ${ACENTRIC_HTTPS_PORT:-443}:${ACENTRIC_HTTPS_PORT:-443}
      - ${ACENTRIC_HTTPS_PORT:-443}:${ACENTRIC_HTTPS_PORT:-443}/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Its certificates: kept, so that it does not ask for new ones each time it starts.
      - caddy-data:/data
      - caddy-config:/config

# Files of the folder secrets/, made once (README.md). The folder is for this machine's user
# alone (700); its files are readable (644), for the server's user in the container.
secrets:
  # What agents' secrets and the keys of model accounts are sealed with. Keep a copy somewhere
  # other than this machine: without it, what was sealed with it does not open again.
  secret-key:
    file: ./secrets/secret-key
  # An API key that may do everything, which other keys are made with.
  admin-key:
    file: ./secrets/admin-key

volumes:
  data:
  backups:
  caddy-data:
  caddy-config:
