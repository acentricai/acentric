# The Rust side of the repository: the machine daemon. The TypeScript side is the pnpm
# workspace beside it (pnpm-workspace.yaml).

[workspace]
resolver = "3"
members = ["apps/machine"]

[workspace.package]
version = "0.15.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/acentricai/acentric"

# The daemon is handed out by every engine, and fetched by every machine: it is kept small.
[profile.release]
strip = true
lto = "thin"
